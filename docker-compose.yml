services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:-https://deploy.effluence.com.au/oauth/callback}
    volumes:
      - sfcowboy_data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  sfcowboy_data:
  caddy_data:
  caddy_config:
