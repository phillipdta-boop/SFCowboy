<!--
  SF Cowboy — "Reauthentication" email template
  Paste into: Supabase Dashboard → Authentication → Email Templates → Reauthentication
  (leave the Subject line as-is or set it to something like "Your SF Cowboy confirmation code")

  Unlike the other templates, Supabase sends this one as a 6-digit CODE rather than a link (the
  user is already signed in and is confirming a sensitive action, so there's nothing to click
  through to) -- it's typed back into the app, so the design leads with the code itself rather
  than a button.

  Template variables used (Supabase's own Go-template syntax, filled in automatically):
    {{ .Token }} — the 6-digit one-time confirmation code
-->
<div style="background-color:#f4f5f7;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
          <!-- Logo -->
          <tr>
            <td align="center" style="padding:32px 32px 8px;">
              <svg width="40" height="40" viewBox="0 0 64 64" role="img" aria-label="SF Cowboy">
                <ellipse cx="32" cy="44" rx="26" ry="7" fill="#8a5a2b" />
                <path d="M18 40 C18 24 24 12 32 12 C40 12 46 24 46 40 Z" fill="#a56b34" />
                <ellipse cx="32" cy="40" rx="10" ry="4" fill="#5c3a1a" />
              </svg>
              <div style="margin-top:8px;font-size:18px;font-weight:700;color:#111827;">SF Cowboy</div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:8px 40px 0;text-align:center;">
              <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3;color:#111827;">Confirm it's you</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4b5563;">
                Enter this code in SF Cowboy to confirm the action you're taking. It expires shortly.
              </p>
            </td>
          </tr>

          <!-- Code block -->
          <tr>
            <td align="center" style="padding:0 40px 32px;">
              <div
                style="display:inline-block;padding:16px 28px;border-radius:8px;background-color:#e3f4f2;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:0.3em;color:#177f7c;"
              >
                {{ .Token }}
              </div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px;border-top:1px solid #e5e7eb;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;">
                If you didn't request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
