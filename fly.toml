app = "sfcowboy"
primary_region = "syd"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  # Must live on the mounted volume below: the container filesystem is ephemeral, so the
  # config default of a relative ./sfcowboy.db would be wiped on every deploy/restart.
  DB_PATH = "/data/sfcowboy.db"

[[mounts]]
  source = "sfcowboy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
