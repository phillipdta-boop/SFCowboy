app = "sfcowboy"
primary_region = "syd"

[build]

[env]
  PORT = "3000"
  # Must live on the mounted volume below: the container filesystem is ephemeral, so the
  # config default of a relative ./data would be wiped on every deploy/restart.
  DATA_DIR = "/data"

# ENCRYPTION_KEY, DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY are required at runtime
# (see server/src/config.ts) and are set via `fly secrets set`, not here, since this file is
# committed to the repo -- see the "Alternative: Fly.io" section of README.md.

[[mounts]]
  source = "sfcowboy_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
