name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets deploy-tunnel-host be re-run by hand (Actions -> CI -> Run workflow) without having to
  # invent a commit -- for redeploying after restarting the host, or retrying a failed deploy.
  workflow_dispatch:

jobs:
  # Everything here is deterministic and needs no secrets, no database and no network: the web
  # suite, a full server typecheck, and the server tests that don't touch Supabase. ~1 minute
  # against the integration suite's ~46, which is what makes an automatic deploy practical.
  #
  # This is the job that gates deploys. The trade is explicit: a regression only the integration
  # suite would catch can now reach production. That was already true in practice -- the
  # integration suite has been red since 14 September for reasons unrelated to any deployed
  # change, so gating on it meant nothing shipped at all.
  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd web && npm install && npm test
      - run: cd server && npm install
      # Typechecks all server code including the tests the fast job doesn't execute, so a change
      # that breaks an integration test's compilation still fails here rather than 46 minutes later.
      - run: cd server && npx tsc --noEmit -p tsconfig.json
      # An explicit list, not a glob: the distinction is "needs a live Supabase project", which
      # isn't visible in a filename. A new server test file therefore runs in the integration job
      # by default and must be added here deliberately -- which fails safe, since the worst case
      # is that it runs slower rather than not at all.
      - run: |
          cd server && npx vitest run \
            src/auth/oauth.test.ts \
            src/crypto/encryption.test.ts \
            src/engine/convert.test.ts \
            src/engine/deployPrimitive.test.ts \
            src/engine/diff.test.ts \
            src/engine/gitComponents.test.ts \
            src/engine/orgComponents.test.ts \
            src/engine/sfConnection.test.ts \
            src/engine/staticAnalysis.test.ts

  # The full server suite against the shared sfcowboy-dev Supabase project. Reports status but
  # deliberately gates nothing: it depends on external email delivery and a shared database, so a
  # failure here often says something about the environment rather than the commit.
  test-integration:
    runs-on: ubuntu-latest
    # The shared project's Postgres has a hard connection cap, and two runs at once exhaust it --
    # overlapping runs on two branches both died with "remaining connection slots are reserved for
    # roles with the SUPERUSER attribute", "sorry, too many clients already" and EMAXPOOLSREACHED,
    # neither having touched server code. A constant group (not keyed by ref) is the point: the
    # contention is between branches, so one database means one run at a time, repo-wide.
    # cancel-in-progress stays false so a queued run waits rather than killing the run holding the
    # connections.
    concurrency:
      group: shared-supabase-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # gitConnections.test.ts's commitAllAndPush tests run a real `git commit` (against a
      # scratch repo, not this checkout) -- git refuses that with "Author identity unknown"
      # unless some identity is configured, and the runner has none by default.
      - run: |
          git config --global user.email "ci@sfcowboy.invalid"
          git config --global user.name "SFCowboy CI"
      - run: cd server && npm install && npm test
        env:
          # The server suite now needs a real Supabase project -- schema.sql references auth.users
          # unconditionally, so there's no local/ephemeral Postgres this can run against anymore
          # (see docs/superpowers/specs/2026-09-11-supabase-auth-migration-design.md). Reuses the
          # same sfcowboy-dev project as local development; TEST_DATABASE_URL and DATABASE_URL are
          # intentionally the same connection string, matching server/.env's own local setup.
          # Tests that hit Supabase's real (rate-limited) email-sending API may occasionally fail
          # with "email rate limit exceeded" -- an accepted, environmental flakiness class, not a
          # code defect (see server/src/users/team.test.ts's own comment on this).
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-fly:
    needs: test-fast
    # Disabled for now -- no Fly.io app exists yet and FLY_API_TOKEN isn't set (deliberate: the
    # product isn't ready to ship, and Fly.io billing starts the moment a machine is created, not
    # just when it's actually used). Re-enable by deleting "false && " below once the Fly.io app is
    # created and FLY_API_TOKEN/VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY secrets are set -- see the
    # README's "Alternative: Fly.io" section for the one-time setup steps.
    if: false && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY are inlined into the web bundle at Docker build
      # time (see Dockerfile's web-build stage) -- fly.toml can't carry them itself since it's
      # committed to the repo, so they're passed as build args here instead, sourced from repo
      # secrets. See the "Alternative: Fly.io" section of README.md.
      - run: |
          flyctl deploy --remote-only \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # Deploys to the machine that hosts the Cloudflare Tunnel, by running ON it via a self-hosted
  # runner rather than reaching in from outside. See README's "How production actually runs today".
  #
  # This replaces an SSH + `docker compose` job that could never have worked: there is no VM and no
  # Docker daemon in this topology. A self-hosted runner is also the right shape for a host that is
  # only reachable through a tunnel -- it connects outbound to GitHub and pulls work, so it needs no
  # inbound ports, no SSH key and no credentials of any kind.
  #
  # Deliberately does NOT use actions/checkout: the deployment target is the existing working copy
  # that scripts/dev-preview.mjs is already serving from, so this updates that checkout in place.
  # A separate workspace checkout would build a bundle nothing is serving.
  deploy-tunnel-host:
    needs: test-fast
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Must match the label given to the runner registered on the tunnel host -- see README,
    # "Automatic deploys (self-hosted runner)".
    runs-on: [self-hosted, sfcowboy-tunnel-host]
    # A self-hosted job with no matching online runner queues indefinitely rather than failing. This
    # bounds it: if the host is off, the deploy fails visibly rather than sitting in the queue
    # looking like it might still be about to happen.
    timeout-minutes: 15
    concurrency:
      group: deploy-tunnel-host
      cancel-in-progress: false
    defaults:
      run:
        # Windows PowerShell 5.1 is the default shell on a Windows runner and rejects `&&` outright.
        # Git Bash is present on this host by definition -- it is a git checkout machine.
        shell: bash
    env:
      # Absolute path of the live checkout on the host: the one dev-preview.mjs serves from. A repo
      # variable rather than a committed path, since it is specific to that machine and this repo is
      # public. Settings -> Secrets and variables -> Actions -> Variables.
      LIVE: ${{ vars.DEPLOY_CHECKOUT_PATH }}
    steps:
      - name: Check the host is configured
        run: |
          set -euo pipefail
          if [ -z "${LIVE:-}" ]; then
            echo "::error::Repository variable DEPLOY_CHECKOUT_PATH is not set. Set it to the absolute path of the live checkout on the tunnel host, e.g. C:/Users/<you>/SFCowboy."
            exit 1
          fi
          if [ ! -d "$LIVE/.git" ]; then
            echo "::error::DEPLOY_CHECKOUT_PATH ($LIVE) is not a git checkout."
            exit 1
          fi
          echo "live checkout: $LIVE"

      - name: Update the live checkout to this commit
        run: |
          set -euo pipefail
          cd "$LIVE"
          # Captured before the reset so the next step can tell whether server code moved.
          echo "PREV_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --prune origin
          # Reset to the exact commit that triggered this run, not origin/main: two merges in quick
          # succession would otherwise both deploy whichever one happened to land first, and the
          # earlier run would silently ship the later code.
          #
          # reset --hard rather than pull, because a pull wedges on a conflict if the working copy
          # has drifted and then hangs waiting for an editor that will never open. web/dist and
          # server/dist are build outputs and .env files are gitignored, so nothing needed survives
          # in the working tree that this would destroy.
          git reset --hard "${{ github.sha }}"
          git log -1 --format='now at %h %s'

      - name: Build
        run: |
          set -euo pipefail
          # The frontend goes live the instant this writes web/dist: express serves it from disk per
          # request, so there is no restart and no downtime for a UI change.
          cd "$LIVE/web" && npm ci && npm run build
          # server/dist is rebuilt so the checkout is internally consistent, but the running process
          # loaded its code at startup and will not pick this up -- see the restart check below.
          cd "$LIVE/server" && npm ci && npm run build

      - name: Verify the app is serving
        run: |
          set -uo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "https://deploy.effluence.com.au/api/health?ci=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code:-no response}"
            sleep 5
          done
          echo "::error::/api/health did not return 200 after the deploy."
          exit 1

      - name: Confirm the site is serving this build
        run: |
          set -euo pipefail
          # The check that actually proves a deploy happened. A successful build says nothing about
          # what the public URL is serving -- a UI change once sat merged on main for two days while
          # the site served an older bundle, and every green signal at the time agreed it was fine.
          # Vite content-hashes the filename, so comparing built against served is exact.
          built=$(ls "$LIVE/web/dist/assets/" | grep -E '^index-.*\.js$' | head -1)
          served=$(curl -s --max-time 20 "https://deploy.effluence.com.au/?ci=${GITHUB_RUN_ID}" \
            | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "built:  $built"
          echo "served: $served"
          if [ "$built" != "$served" ]; then
            echo "::error::The site is serving $served but this deploy built $built. The tunnel may point at a different checkout than DEPLOY_CHECKOUT_PATH."
            exit 1
          fi

      - name: Flag server changes that need a restart
        run: |
          set -euo pipefail
          cd "$LIVE"
          changed=$(git diff --name-only "$PREV_SHA" "${{ github.sha }}" -- server/ | head -20 || true)
          if [ -n "$changed" ]; then
            echo "::warning::server/ changed and server/dist was rebuilt, but the running process still has the old code loaded. Restart scripts/dev-preview.mjs on the host to activate it."
            echo "Server files changed in this deploy:"
            echo "$changed" | sed 's/^/  /'
          else
            echo "No server/ changes in this deploy -- nothing to restart."
          fi
